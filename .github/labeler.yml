# GitHub Labeler Configuration
# Automatically labels PRs based on changed files

# Type labels
'type: feature':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/**/*/page.tsx'
          - 'src/app/**/*/route.ts'
          - 'src/components/**/*'
          - 'src/lib/**/*'

'type: chore':
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**/*'
          - '*.config.*'
          - 'package.json'
          - 'package-lock.json'
          - '.github/**/*'

'type: documentation':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '*.md'
          - 'CLAUDE.md'
          - 'README.md'

'type: refactor':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/utils/**/*'

'type: security':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/security-scan.yml'
          - 'src/middleware.ts'

# Project labels
'project: empathy-ledger':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/empathy-ledger/**/*'
          - 'src/app/api/empathy-ledger/**/*'

'project: justicehub':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/justicehub/**/*'

'project: harvest':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/harvest/**/*'

'project: goods':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/goods/**/*'

# Feature area labels
'area: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/api/**/*'

'area: dashboard':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/page.tsx'
          - 'src/components/dashboard/**/*'

'area: wiki':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/admin/wiki/**/*'
          - 'src/lib/knowledge/**/*'

'area: database':
  - changed-files:
      - any-glob-to-any-file:
          - 'supabase/**/*'
          - 'database.types.ts'

# LCAA labels
'lcaa: action':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/api/**/*'
          - 'src/lib/services/**/*'

'lcaa: art':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**/*'
          - 'src/app/**/*/page.tsx'
