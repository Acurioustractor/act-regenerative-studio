name: Sync GitHub to Notion

on:
  # Trigger on issue events
  issues:
    types: [opened, edited, closed, reopened, assigned, labeled, unlabeled]

  # Backup: every 15 minutes
  schedule:
    - cron: '*/15 * * * *'

  # Manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install @notionhq/client@^2.2.0 @octokit/rest@^20.0.0

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_PROJECT_ID: 'PVT_kwHOCOopjs4BLVik'
        run: |
          node scripts/sync-github-to-notion.js

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Sync failed. Check logs for details."
          exit 1
