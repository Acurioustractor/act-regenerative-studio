name: 🚀 Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      # The previous amondnet/vercel-action@v25 pinned Vercel CLI 25.1.0, which
      # Vercel's API now rejects ("requires version 47.2.2 or later"), so every
      # deploy failed at this step. Install the current CLI and deploy directly.
      # VERCEL_ORG_ID + VERCEL_PROJECT_ID identify the project; the token authes.
      - name: 🔼 Install latest Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚀 Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Deployed to Production!**\n\n✅ Build succeeded and deployed to Vercel.\n\n🌾 *ACT Ecosystem - Regenerative Innovation*'
            })

      - name: 📊 Post deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status: ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌾 ACT Quality" >> $GITHUB_STEP_SUMMARY
          echo "All quality checks passed before deployment." >> $GITHUB_STEP_SUMMARY

  # Notify deployment
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: 📢 Deployment notification
        run: |
          echo "Deployment ${{ needs.deploy.result }}"
          # TODO: Add Slack/Discord webhook notification here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"🚀 ACT Main deployed to production: ${{ needs.deploy.result }}"}'
