name: 🧪 CI/CD - Test & Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint & Type Check
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: 🔤 Run TypeScript type check
        run: npm run type-check
        continue-on-error: false

  # Job 2: Build
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build
        env:
          # Public env vars only (never secrets!)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/
          retention-days: 7

  # Job 3: Tests (if they exist)
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Was: `npm test || echo "no tests"` with continue-on-error, which
      # reported green having run nothing. There is a real suite now.
      - name: 🧪 Run tests
        run: npm test
        continue-on-error: false

  # Job 4: Security Audit
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔍 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Job 5: ACT Quality Summary
  quality-summary:
    name: 📊 Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build, test, security-audit]
    if: always()

    steps:
      - name: 📊 Post summary
        run: |
          echo "## 🌾 ACT Quality Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### LCAA Method" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Listen**: Code reviewed for community needs alignment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Curiosity**: Linting and type checking passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Action**: Build successful, ready for deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Art**: Clean, maintainable code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint-and-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
