blockers: []

questions:
  - Some compendium photos are only 800px — need higher-res originals uploaded to EL for full-bleed use
  - Should editorial images be stored in a separate high-res bucket vs the auto-generated compendium thumbnails?

decisions:
  - full_bleed_threshold: Only use full-bleed photo breaks with images >= 2000px wide. Below that, use PhotoStrip grids at 33vw/25vw where 800px is fine.
  - unoptimized_images: All EditableImages skip Next.js optimization (unoptimized prop) since they load from Supabase CDN
  - object_top: Full-bleed photos use object-top to avoid cutting off heads/faces
  - no_cross_project_images: Each page only uses photos from its own project context (user was very clear about this)
  - photo_strip_pattern: 3-col landscape or 4-col square grids between text sections as lightweight visual breaks

findings:
  - compendium_resolution: Compendium photos (photos/compendium-2026/) are mostly 800x533px thumbnails. Only "designing the weave bed" is 2000px. Gallery-uploaded photos (galleries/ and story-media/) are full DSLR resolution (2000-4000px, 1-3MB).
  - full_bleed_css: The full-bleed CSS selector (main > .full-bleed) breaks when ScrollReveal wraps sections in a div. Fixed with main > div > .full-bleed and main > div:has(> .full-bleed).
  - editable_image_fill: Next.js fill Image needs positioned parent. EditableImage wrapper changed from relative h-full w-full to absolute inset-0 to properly fill aspect-ratio containers.
  - image_picker_api: /api/image-picker returns all projects with images. Many projects have 24 images but most are the same bf17d0a9 placeholder. Real images exist for: empathy-ledger (20), justicehub (8), picc-photo-kiosk (24), picc-elders-hull-river (24), picc-annual-report (24), bg-fit (24 mixed mp3/jpg).
  - high_res_sources: JusticeHub gallery has 8 images at 2000px+. Quandamooka gallery has 20+ images at 2000-3000px. PICC galleries have 48 real community photos. EL compendium has 20 images but mostly 800px.

worked:
